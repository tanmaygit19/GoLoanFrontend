<div class="container mt-4">
  <h2>Apply for Loan</h2>

  <form (ngSubmit)="addloan()">
    <div class="mb-3">
      <label for="loanType" class="form-label">Loan Type</label>
      <select id="loanType" name="loanType" [(ngModel)]="data.loanType" class="form-select" required>
        <option value="Personal Loan">Personal Loan</option>
        <option value="Home Loan">Home Loan</option>
        <option value="Car Loan">Car Loan</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="loanAmount" class="form-label">Loan Amount</label>
      <input type="number" id="loanAmount" name="loanAmount" [(ngModel)]="data.loanAmount" class="form-control" required min="1">
    </div>

    <div class="mb-3">
      <label for="tenureMonths" class="form-label">Tenure (Months)</label>
      <select id="tenureMonths" name="tenureMonths" [(ngModel)]="data.tenureMonths" class="form-select" required>
        <option [ngValue]="36">36 Months</option>
        <option [ngValue]="60">60 Months</option>
        <option [ngValue]="120">120 Months</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="bankName" class="form-label">Bank Name</label>
      <input type="text" id="bankName" name="bankName" [(ngModel)]="data.bankName" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="bankAccountNumber" class="form-label">Bank Account Number</label>
      <input type="text" id="bankAccountNumber" name="bankAccountNumber" [(ngModel)]="data.bankAccountNumber" class="form-control" required pattern="[0-9]{9,18}">
    </div>

    <div class="mb-3">
      <label for="ifscCode" class="form-label">IFSC Code</label>
      <input type="text" id="ifscCode" name="ifscCode" [(ngModel)]="data.ifscCode" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="emiDay" class="form-label">EMI Day</label>
      <select id="emiDay" name="emiDay" [(ngModel)]="data.emiDay" class="form-select" required>
        <option [ngValue]="5">5</option>
        <option [ngValue]="7">7</option>
        <option [ngValue]="10">10</option>
        <option [ngValue]="15">15</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Apply Loan</button>
  </form>

  <div *ngIf="message" class="alert alert-info mt-3">
    {{ message }}
  </div>
</div>
