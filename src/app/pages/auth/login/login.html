<div class="login-wrapper">
  <div class="login-card">
    
    <!-- Brand Header -->
    <div class="text-center mb-4">
      <div class="logo-circle mx-auto mb-3">
        <i class="bi bi-currency-rupee"></i>
      </div>
      <h3 class="login-title">GoLoan Login</h3>
      <p class="login-subtitle">Welcome back! Please enter your credentials</p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="alert alert-danger py-2 px-3 mb-3 d-flex align-items-center" style="font-size: 13px;">
      <i class="bi bi-exclamation-circle-fill mr-2"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      
      <!-- Email Field -->
      <div class="form-group mb-3">
        <label class="form-label">Email Address</label>
        <div class="input-box">
          <i class="bi bi-envelope input-icon"></i>
          <input 
            type="email" 
            formControlName="email" 
            class="form-input" 
            placeholder="user@goloan.com" 
            required
          >
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group mb-4">
        <label class="form-label">Password</label>
        <div class="input-box">
          <i class="bi bi-lock input-icon"></i>
          <input 
            type="password" 
            formControlName="password" 
            class="form-input" 
            placeholder="••••••••" 
            required
          >
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-login btn-block">
        Sign In
      </button>
    </form>

    <!-- Divider -->
    <div class="divider my-4">
      <span>OR</span>
    </div>

    <!-- Google Sign-In Container -->
    <div id="googleBtn" class="d-flex justify-content-center w-100"></div>

    <!-- Register Link -->
    <div class="text-center mt-4">
      <span class="text-muted" style="font-size: 13px;">Don't have an account? </span>
      <a routerLink="/register" class="register-link font-weight-bold" style="font-size: 13px;">Register here</a>
    </div>

  </div>
</div>
