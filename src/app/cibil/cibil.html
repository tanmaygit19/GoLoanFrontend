
<div class="cibil-container">

  <div class="cibil-header">
    <h2>📈 CIBIL Score</h2>

    <button (click)="checkScore()">Check Score</button>
  </div>

  <div class="customer-details">
    <div class="detail-box">
      <span>Name</span>
      <h3>{{ cibilReport?.customerName || 'Customer' }}</h3>
    </div>

    <div class="detail-box">
      <span>PAN Number</span>
      <h3>{{ cibilReport?.panNumber || 'XXXXXXXXXX' }}</h3>
    </div>
  </div>

  <div class="score-section" *ngIf="cibilReport">
    <div class="gauge">
      <div class="gauge-value"></div>
      <div class="gauge-cover"></div>
      <div class="gauge-needle"></div>
      <div class="gauge-center"></div>
    </div>

    <div class="gauge-labels">
      <span>300</span>
      <span>{{ cibilReport.cibilScore }}</span>
      <span>900</span>
    </div>

    <h1 class="score-number">{{ cibilReport.cibilScore }}</h1>

    <div class="last-checked">
      <p>Last Checked Date</p>
      <strong>{{ cibilReport.checkDate || 'Not available' }}</strong>
    </div>
  </div>

</div>
