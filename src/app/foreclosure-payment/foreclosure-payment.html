
<div class="container mt-4">
  <h2>Foreclosure Payment</h2>
  <hr />

  <div class="card shadow p-4">
    <h4>Foreclosure Request Details</h4>

    <div class="row mt-3">

      <div class="col-md-6 mb-3">
        <label>Request ID</label>
        <p>{{ requestId }}</p>
      </div>

      <div class="col-md-6 mb-3">
        <label>Loan Account Number</label>
        <p>{{ request?.loanAccountNo }}</p>
      </div>

      <div class="col-md-6 mb-3">
        <label>Foreclosure Type</label>
        <p>{{ request?.type }}</p>
      </div>

      <div class="col-md-6 mb-3">
        <label>Number of EMI</label>
        <p>{{ request?.noOfEmi ?? 'N/A' }}</p>
      </div>

      <div class="col-md-6 mb-3">
        <label>Foreclosure Amount</label>
        <p>₹ {{ request?.amount }}</p>
      </div>

      <div class="col-md-6 mb-3">
        <label>Payment Mode</label>
        <p>Online - Razorpay</p>
      </div>

    </div>

    <hr />

    <div class="text-end">
      <button type="button" class="btn btn-secondary me-2" routerLink="/fore"> Cancel </button>

      <button type="button" class="btn btn-success" (click)="payNow()"> Pay Now </button>

    </div>

  </div>
</div>
