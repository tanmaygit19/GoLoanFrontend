<div class="d-flex" style="min-height: 100vh;">
  <!-- Royal Blue Dynamic Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main View -->
  <div class="flex-grow-1 d-flex flex-column" style="min-width: 0; background-color: #f4f6f9;">
    
    <!-- Top Blue Accent Line (from Customer Screenshot) -->
    <div *ngIf="!isOfficer" class="customer-top-accent">
      <i class="bi bi-bell-fill text-white bell-icon"></i>
    </div>

    <!-- White Topbar Banner -->
    <header class="topbar-banner">
      <div class="welcome-text">
        Welcome, <span class="font-weight-bold">{{ user?.fullName || (isOfficer ? '' : 'Customer') }}</span>
      </div>

      <div>
        <span class="role-pill-btn">
          {{ isOfficer ? 'Loan Officer Panel' : 'Customer Dashboard' }}
        </span>
      </div>
    </header>

    <!-- Page Content Area -->
    <main class="page-body">
      <router-outlet />
    </main>
  </div>
</div>
